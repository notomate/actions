# Paste into Notomate's workflow editor after publishing the action repository.
name: Daily Lunch and Dinner Menu
on:
  schedule:
    - cron: '0 0 * * *' # UTC = Asia/Taipei 08:00
  workflow_dispatch:
jobs:
  meal-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: notomate/actions/actions/daily-meal-plan@v1
        id: meal
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Alternatively replace anthropic-api-key with:
          # claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          servings: '2'
          dietary-preferences: Taiwanese home cooking, low oil, vegetables with every meal
          excluded-ingredients: '' # Example: peanuts, shrimp
          language: Traditional Chinese (Taiwan) # Defaults to English
          instructions: |
            Each meal should take at most 30 minutes to cook.
            Estimate the total ingredient cost in TWD at the end of the shopping list.
          timezone: Asia/Taipei
          # model: <a Claude model available to your account>
      - uses: notomate/actions/actions/write-note@v1
        with:
          notomate-base-url: ${{ vars.NM_API_BASE_URL }}
          notomate-api-key: ${{ secrets.NM_API_KEY }}
          note-visibility: private
          data: ${{ steps.meal.outputs.data }}
          # The default title is English; match it to the chosen language here.
          title: '{{ date }} 午餐與晚餐菜單'
          template: |
            份量：{{ servings }} 人

            {{ content }}
