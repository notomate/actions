# Paste into Notomate's workflow editor after publishing the action repository.
# Set workspace variable STOCK_SYMBOLS, e.g. AAPL,MSFT,2330.TW
name: Daily Stock Watchlist
on:
  schedule:
    - cron: '0 1 * * *' # UTC = Asia/Taipei 09:00
  workflow_dispatch:
jobs:
  stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: notomate/actions/actions/stocks@v1
        id: stocks
        with:
          symbols: ${{ vars.STOCK_SYMBOLS }}
          timezone: Asia/Taipei
      - uses: notomate/actions/actions/write-note@v1
        with:
          notomate-base-url: ${{ vars.NM_API_BASE_URL }}
          notomate-api-key: ${{ secrets.NM_API_KEY }}
          note-visibility: private
          data: ${{ steps.stocks.outputs.data }}
          # Omit template to publish the default table; this one loops over quotes.
          template: |
            Daily bars from Yahoo Finance, retrieved at {{ retrieved_at }}. Not real-time quotes.

            | Symbol | Date | Close | Change % |
            | --- | --- | ---: | ---: |
            {% for q in quotes %}
            | {{ q.symbol | md_cell }} | {{ q.date }} | {{ q.close | number }} {{ q.currency | md_cell }} | {{ q.percent | number('+.2f') }} |
            {% endfor %}
            {% if failures %}

            ## Unavailable

            {% for f in failures %}
            - {{ f.symbol | md }}: {{ f.error }}
            {% endfor %}
            {% endif %}
