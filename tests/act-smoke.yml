# Manual local smoke test, invoked by tests/act_smoke.py (not a Notomate workflow).
name: Local composite smoke
on:
  workflow_dispatch:
jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: ./actions/rss
        id: rss
        with:
          feed-url: ${{ env.MOCK_ORIGIN }}/feed
      - uses: ./actions/write-note
        id: note
        if: steps.rss.outputs.conclusion == 'success'
        with:
          notomate-base-url: ${{ env.MOCK_ORIGIN }}
          notomate-api-key: mock-only-key
          data: ${{ steps.rss.outputs.data }}
          template: |
            {% for item in items %}
            - {{ item.title }}
            {% endfor %}
      - name: Verify composite outputs
        shell: bash
        env:
          NOTE_ID: ${{ steps.note.outputs.note-id }}
          CONCLUSION: ${{ steps.note.outputs.conclusion }}
        run: |
          test "$NOTE_ID" = "smoke-note"
          test "$CONCLUSION" = "success"
