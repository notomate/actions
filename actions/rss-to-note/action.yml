name: Notomate RSS to Note
description: Fetch an RSS or Atom feed and output its latest entries as note content for write-note.
inputs:
  timezone:
    description: IANA time zone for the note date (does not change cron).
    default: Asia/Taipei
  feed-url:
    description: RSS or Atom feed URL.
    default: https://www.usnews.com/rss/news
  max-items:
    description: Maximum entries per note, from 1 to 100.
    default: '10'
outputs:
  title:
    description: Default note title.
    value: ${{ steps.run.outputs.title }}
  content:
    description: Default Markdown note body.
    value: ${{ steps.run.outputs.content }}
  data:
    description: JSON template data (title, content, date, retrieved_at, feed_title, source, items).
    value: ${{ steps.run.outputs.data }}
  conclusion:
    description: success, skipped (empty feed, no outputs) or failure.
    value: ${{ steps.run.outputs.conclusion || 'failure' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install RSS dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -r "$ACTION_PATH/../../requirements/rss.txt"
    - name: Build RSS digest
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
        INPUT_FEED_URL: ${{ inputs.feed-url }}
        INPUT_MAX_ITEMS: ${{ inputs.max-items }}
      run: python "$ACTION_PATH/../../scripts/rss_to_note.py"
