name: Notomate Stocks to Note
description: Fetch configured Yahoo Finance symbols with yfinance and output a daily-price note for write-note.
inputs:
  timezone:
    description: IANA time zone for the note date (does not change cron).
    default: Asia/Taipei
  symbols:
    description: 1 to 50 Yahoo Finance symbols, separated by commas or newlines (e.g. AAPL,2330.TW).
    required: true
outputs:
  title:
    description: Default note title.
    value: ${{ steps.run.outputs.title }}
  content:
    description: Default Markdown note body.
    value: ${{ steps.run.outputs.content }}
  data:
    description: JSON template data (title, content, date, retrieved_at, quotes, failures).
    value: ${{ steps.run.outputs.data }}
  conclusion:
    description: success or failure; partial data is success with failures listed.
    value: ${{ steps.run.outputs.conclusion || 'failure' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install stock dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -r "$ACTION_PATH/../../requirements/stocks.txt"
    - name: Build stock report
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
        INPUT_SYMBOLS: ${{ inputs.symbols }}
      run: python "$ACTION_PATH/../../scripts/stocks_to_note.py"
