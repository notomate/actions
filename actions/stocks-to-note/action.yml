name: Notomate Stocks to Note
description: Fetch configured Yahoo Finance symbols with yfinance and publish one daily-price note.
inputs:
  notomate-base-url:
    description: Notomate origin reachable from the runner.
    required: true
  notomate-api-key:
    description: Notomate personal API key.
    required: true
  note-visibility:
    description: private, workspace or public.
    default: private
  timezone:
    description: IANA time zone for the note date (does not change cron).
    default: Asia/Taipei
  symbols:
    description: 1 to 50 Yahoo Finance symbols, separated by commas or newlines (e.g. AAPL,2330.TW).
    required: true
outputs:
  note-id:
    description: ID of the created note; empty when publication is unconfirmed.
    value: ${{ steps.run.outputs.note-id }}
  conclusion:
    description: success or failure; partial data is success with warnings in the note.
    value: ${{ steps.run.outputs.conclusion || 'failure' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install stock dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -r "$ACTION_PATH/../../requirements/stocks.txt"
    - name: Publish stock report
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_NOTOMATE_BASE_URL: ${{ inputs.notomate-base-url }}
        INPUT_NOTOMATE_API_KEY: ${{ inputs.notomate-api-key }}
        INPUT_NOTE_VISIBILITY: ${{ inputs.note-visibility }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
        INPUT_SYMBOLS: ${{ inputs.symbols }}
      run: python "$ACTION_PATH/../../scripts/stocks_to_note.py"
