name: Notomate Daily Meal Plan
description: Generate home-cooked lunch and dinner recipes with Claude and output them as note content for write-note.
inputs:
  timezone:
    description: IANA time zone for the note date (does not change cron).
    default: Asia/Taipei
  anthropic-api-key:
    description: Anthropic API key; provide this or claude-code-oauth-token.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token; alternative to anthropic-api-key.
    required: false
  servings:
    description: Number of people, from 1 to 20.
    default: '2'
  dietary-preferences:
    description: Dietary preferences; defaults to Taiwanese home cooking.
    required: false
  excluded-ingredients:
    description: Ingredients that must not appear in the menu or shopping list.
    required: false
  language:
    description: Language Claude writes the menu in, e.g. Traditional Chinese (Taiwan).
    default: English
  instructions:
    description: Extra instructions for Claude, e.g. budget, cooking time, format or number of dishes.
    required: false
  model:
    description: Claude model ID or alias.
    default: claude-sonnet-5
outputs:
  title:
    description: Default note title.
    value: ${{ steps.run.outputs.title }}
  content:
    description: Claude's Markdown menu.
    value: ${{ steps.run.outputs.content }}
  data:
    description: JSON template data (title, content, date, servings, dietary_preferences, excluded_ingredients, language, instructions).
    value: ${{ steps.run.outputs.data }}
  conclusion:
    description: success or failure.
    value: ${{ steps.run.outputs.conclusion || 'failure' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Claude Code
      shell: bash
      run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.292
    - name: Generate recipes
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        INPUT_SERVINGS: ${{ inputs.servings }}
        INPUT_DIETARY_PREFERENCES: ${{ inputs.dietary-preferences }}
        INPUT_EXCLUDED_INGREDIENTS: ${{ inputs.excluded-ingredients }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_INSTRUCTIONS: ${{ inputs.instructions }}
        INPUT_MODEL: ${{ inputs.model }}
      run: python "$ACTION_PATH/../../scripts/meal_plan.py"
