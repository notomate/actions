name: Notomate Write Note
description: Render a note from a Jinja2 template and JSON data, then publish it to Notomate.
inputs:
  notomate-base-url:
    description: Notomate origin reachable from the runner.
    required: true
  notomate-api-key:
    description: Notomate personal API key.
    required: true
  note-visibility:
    description: private, workspace or public.
    default: private
  data:
    description: JSON object used as template variables, usually another action's data output.
    default: '{}'
  title:
    description: Jinja2 template for the note title; defaults to the data's title.
    default: '{{ title }}'
  template:
    description: Jinja2 template for the Markdown note body; defaults to the data's content.
    default: '{{ content }}'
outputs:
  note-id:
    description: ID of the created note; empty when publication is unconfirmed.
    value: ${{ steps.run.outputs.note-id }}
  conclusion:
    description: success or failure.
    value: ${{ steps.run.outputs.conclusion || 'failure' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install note dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -r "$ACTION_PATH/../../requirements/note.txt"
    - name: Render and publish note
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_NOTOMATE_BASE_URL: ${{ inputs.notomate-base-url }}
        INPUT_NOTOMATE_API_KEY: ${{ inputs.notomate-api-key }}
        INPUT_NOTE_VISIBILITY: ${{ inputs.note-visibility }}
        INPUT_DATA: ${{ inputs.data }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_TEMPLATE: ${{ inputs.template }}
      run: python "$ACTION_PATH/../../scripts/write_note.py"
